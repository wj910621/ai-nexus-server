name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: comic_user
          POSTGRES_PASSWORD: comic_password
          POSTGRES_DB: comic_studio_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov ruff mypy

      - name: Lint with ruff
        working-directory: backend
        run: ruff check app/

      - name: Type check with mypy
        working-directory: backend
        run: mypy app/ --ignore-missing-imports
        continue-on-error: true  # Don't fail CI on type issues

      - name: Run tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://comic_user:comic_password@localhost:5432/comic_studio_test
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET_KEY: test-secret-not-for-prod
          APP_ENV: test
        run: |
          pytest -v --cov=app --cov-report=xml --cov-report=term

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: matrix.python-version == '3.13'
        with:
          file: backend/coverage.xml
