# Production overlay for docker-compose
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Differences from base docker-compose.yml:
# - No source-code bind mounts (image-baked only)
# - No frontend container (served via CDN/static hosting in prod)
# - Resource limits on every service
# - Restart policy: always
# - Backend reads .env.production (not dev .env)
# - nginx uses TLS (certs mounted from /etc/ssl/private)

version: "3.9"

services:
  backend:
    env_file: ../.env.production
    volumes:
      - uploads:/app/uploads
    restart: always
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          memory: 512M

  postgres:
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  redis:
    restart: always
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  nginx:
    restart: always
    ports: ["80:80", "443:443"]
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./tls:/etc/nginx/tls:ro
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  prometheus:
    restart: always
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  alertmanager:
    restart: always

  grafana:
    restart: always
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

volumes:
  postgres_data:
  redis_data:
  uploads:
  prometheus_data:
  grafana_data:
