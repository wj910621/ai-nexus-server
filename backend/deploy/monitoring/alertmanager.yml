global:
  resolve_timeout: 5m

route:
  group_by: ["alertname", "severity"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: "feishu-webhook"
  routes:
    - matchers:
        - severity="critical"
      receiver: "feishu-webhook"
      continue: true
    - matchers:
        - severity="warning"
      receiver: "feishu-webhook"

receivers:
  - name: "feishu-webhook"
    webhook_configs:
      - url: "https://open.feishu.cn/open-apis/bot/v2/hook/REPLACE_WITH_FEISHU_BOT_TOKEN"
        send_resolved: true

  - name: "dingtalk-webhook"
    webhook_configs:
      - url: "https://oapi.dingtalk.com/robot/send?access_token=REPLACE_WITH_DINGTALK_TOKEN"
        send_resolved: true

inhibit_rules:
  - source_matchers:
      - severity="critical"
    target_matchers:
      - severity="warning"
    equal: ["alertname"]
