services:
  postgres:
    image: docker.m.daocloud.io/library/postgres:16-alpine
    restart: unless-stopped
    env_file: .env.production
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"], interval: 10s, timeout: 5s, retries: 10}
  redis:
    image: docker.m.daocloud.io/library/redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy noeviction
    volumes: [redis_data:/data]
    healthcheck: {test: ["CMD", "redis-cli", "ping"], interval: 10s, timeout: 5s, retries: 10}
  api:
    build: {context: .., dockerfile: deploy/Dockerfile.cpu}
    restart: unless-stopped
    env_file: .env.production
    depends_on: {postgres: {condition: service_healthy}, redis: {condition: service_healthy}}
    ports: ["127.0.0.1:18000:8000"]
    volumes: [story_uploads:/app/uploads]
volumes: {postgres_data: {}, redis_data: {}, story_uploads: {}}
