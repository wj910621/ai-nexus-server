[project]
name = "comic-studio-backend"
version = "0.1.0"
description = "ComicStudio AI - 商业化漫剧生成软件后端"
requires-python = ">=3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
# SQLAlchemy 2 names its portable UUID type ``Uuid``.  The models intentionally
# expose it as ``UUID`` to keep column declarations consistent across dialects.
ignore = ["E501", "N814"]
