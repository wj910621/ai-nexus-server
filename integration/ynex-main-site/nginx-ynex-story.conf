# Merge these routes into the existing ynexai.cn HTTPS server block.
# Portal and Story Studio remain separate services behind one origin.

location = /story {
    return 308 /story/;
}

location /story/ {
    alias /srv/ynex/story-web/;
    try_files $uri $uri/ /story/index.html;
}

location /story-api/ {
    proxy_pass http://127.0.0.1:8000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
}

location /story-ws/ {
    proxy_pass http://127.0.0.1:8000/ws/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

location = /download/story {
    return 308 /download/story/;
}

location /download/story/ {
    alias /srv/ynex/story-downloads/;
    try_files $uri $uri/ /download/story/index.html;
}
