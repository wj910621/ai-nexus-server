# =============================================================================
# 前端 Nginx 配置文件
# Phase 8 P4 K8s 容器化
# =============================================================================
# 功能：
#   1. 静态资源服务（前端 SPA）
#   2. /api/ 反向代理到后端 Web 服务
#   3. /ws/ WebSocket 反向代理到后端 Web 服务
# =============================================================================

# 监听 8080 端口（nginx-unprivileged 非 root 运行，默认监听 8080）
server {
    listen       8080;
    listen       [::]:8080;
    server_name  _;

    # 前端 SPA 静态资源根目录
    root   /usr/share/nginx/html;
    index  index.html;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # -----------------------------------------------------------------------------
    # SPA 路由回退：所有未匹配静态文件的请求都回退到 index.html
    # 这是 React/Vue 等前端路由框架（如 react-router）的标准配置
    # -----------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # -----------------------------------------------------------------------------
    # /api/ 反向代理：转发到后端 Web 服务 (backend-web:8000)
    # backend-web 为 K8s Service 名称
    # -----------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://backend-web:8000;

        # 设置反向代理标准请求头
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 代理超时设置
        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # -----------------------------------------------------------------------------
    # /ws/ WebSocket 反向代理：转发到后端 Web 服务 (backend-web:8000)
    # 必须配置 HTTP 1.1 与 Upgrade/Connection 头以支持 WebSocket 升级握手
    # -----------------------------------------------------------------------------
    location /ws/ {
        proxy_pass http://backend-web:8000;

        # WebSocket 必须使用 HTTP/1.1
        proxy_http_version 1.1;

        # WebSocket 升级握手头
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        # 标准反向代理请求头
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 长连接超时设置（默认 60s 会断开空闲连接，这里延长到 3600s）
        proxy_connect_timeout 60s;
        proxy_send_timeout    3600s;
        proxy_read_timeout    3600s;
    }

    # -----------------------------------------------------------------------------
    # 静态资源缓存优化（可选）
    # -----------------------------------------------------------------------------
    location ~* \.(?:css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 禁止访问隐藏文件（如 .git、.env）
    location ~ /\. {
        deny all;
    }
}
