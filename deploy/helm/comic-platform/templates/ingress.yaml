{{- if .Values.ingress.enabled -}}
{{- $fullName := include "comic.fullname" . -}}
{{- $commonAnnotations := dict
  "nginx.ingress.kubernetes.io/ssl-redirect" "true"
  "nginx.ingress.kubernetes.io/proxy-body-size" "20m"
  "nginx.ingress.kubernetes.io/proxy-read-timeout" "300"
  "nginx.ingress.kubernetes.io/proxy-send-timeout" "300"
  "nginx.ingress.kubernetes.io/use-regex" "true"
-}}
{{- range $route := list
  (dict "name" "frontend" "path" $.Values.ingress.paths.frontend "rewrite" "/$2" "service" (printf "%s-frontend" $fullName) "port" 8080)
  (dict "name" "api" "path" $.Values.ingress.paths.api "rewrite" "/api/$2" "service" (printf "%s-web" $fullName) "port" 8000)
  (dict "name" "ws" "path" $.Values.ingress.paths.websocket "rewrite" "/ws/$2" "service" (printf "%s-web" $fullName) "port" 8000)
}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullName }}-{{ $route.name }}
  namespace: {{ $.Values.namespace.name }}
  labels:
    {{- include "comic.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $route.name }}
  annotations:
    {{- toYaml $commonAnnotations | nindent 4 }}
    nginx.ingress.kubernetes.io/rewrite-target: {{ $route.rewrite | quote }}
    {{- if $.Values.certManager.enabled }}
    cert-manager.io/{{ $.Values.certManager.issuerType }}: {{ $.Values.certManager.issuerName | quote }}
    {{- end }}
    {{- if $.Values.ingress.rateLimit.enabled }}
    nginx.ingress.kubernetes.io/limit-rps: {{ $.Values.ingress.rateLimit.rps | quote }}
    nginx.ingress.kubernetes.io/limit-burst: {{ $.Values.ingress.rateLimit.burst | quote }}
    {{- end }}
spec:
  ingressClassName: {{ $.Values.ingress.className }}
  {{- if $.Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ $.Values.ingress.host }}
      secretName: {{ $.Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ $.Values.ingress.host }}
      http:
        paths:
          - path: {{ printf "%s(/|$)(.*)" ($route.path | trimSuffix "/") | quote }}
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ $route.service }}
                port:
                  number: {{ $route.port }}
---
{{- end }}
{{- end }}
