{{/*
ResourceQuota - Phase 8 P7 安全加固
限制命名空间资源使用总量，防止资源耗尽攻击
- CPU/内存 请求与限制总量
- PVC、Deployment、Pod 数量上限
*/}}
apiVersion: v1
kind: ResourceQuota
metadata:
  name: {{ include "comic.fullname" . }}-quota
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "comic.labels" . | nindent 4 }}
spec:
  hard:
    requests.cpu: "8"
    requests.memory: 16Gi
    limits.cpu: "16"
    limits.memory: 32Gi
    persistentvolumeclaims: "10"
    count/deployments.apps: "20"
    count/pods: "50"
