{{/*
Redis StatefulSet - 内置缓存与消息队列
仅在 redis.enabled=true 且 redis.external=false 时创建
生产环境推荐使用外部托管 Redis (Redis Labs/ElastiCache 等)
*/}}
{{- if and .Values.redis.enabled (not .Values.redis.external) -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "comic.fullname" . }}-redis
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "comic.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  serviceName: {{ include "comic.fullname" . }}-redis
  replicas: 1
  selector:
    matchLabels:
      {{- include "comic.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: redis
  template:
    metadata:
      labels:
        {{- include "comic.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: redis
    spec:
      containers:
        - name: redis
          image: bitnami/redis:7
          imagePullPolicy: IfNotPresent
          # P7: 强制启用密码认证
          command:
            - sh
            - -c
            - redis-server --requirepass "$(REDIS_PASSWORD)"
          ports:
            - name: tcp-redis
              containerPort: 6379
              protocol: TCP
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "comic.fullname" . }}
                  key: REDIS_PASSWORD
          # 数据持久化目录
          volumeMounts:
            - name: data
              mountPath: /bitnami/redis/data
          # 存活探针 - P7: 使用密码认证
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - redis-cli -a "$(REDIS_PASSWORD)" ping
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          # 就绪探针 - P7: 使用密码认证
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - redis-cli -a "$(REDIS_PASSWORD)" ping
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "comic.labels" . | nindent 10 }}
          app.kubernetes.io/component: redis
      spec:
        accessModes:
          - ReadWriteOnce
        {{- if .Values.global.storageClass }}
        storageClassName: {{ .Values.global.storageClass }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.redis.persistence.size }}
---
# Redis Service - 集群内访问入口
apiVersion: v1
kind: Service
metadata:
  name: {{ include "comic.fullname" . }}-redis
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "comic.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  type: ClusterIP
  ports:
    - name: tcp-redis
      port: 6379
      targetPort: tcp-redis
      protocol: TCP
  selector:
    {{- include "comic.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: redis
{{- end -}}
