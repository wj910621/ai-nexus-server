{{/*
Secret - 敏感配置
包含 JWT 密钥、数据库密码、Redis 密码、OSS 密钥
当 externalSecrets.enabled=true 时使用外部密钥管理工具,此模板不渲染
Phase 8 P7: 未提供值时使用 randAlphaNum 自动生成随机密码
*/}}
{{- if not .Values.externalSecrets.enabled -}}
{{- $existing := lookup "v1" "Secret" .Values.namespace.name (include "comic.fullname" .) -}}
{{- $existingData := (default dict $existing.data) -}}
{{- $existingJwt := (default "" (index $existingData "JWT_SECRET_KEY")) | b64dec -}}
{{- $existingApp := (default "" (index $existingData "APP_SECRET_KEY")) | b64dec -}}
{{- $existingPg := (default "" (index $existingData "POSTGRES_PASSWORD")) | b64dec -}}
{{- $existingRedis := (default "" (index $existingData "REDIS_PASSWORD")) | b64dec -}}
{{- $jwtSecret := .Values.jwt.secret | default $existingJwt | default (randAlphaNum 64) -}}
{{- $appSecret := $existingApp | default (randAlphaNum 64) -}}
{{- $pgPassword := .Values.postgresql.password | default $existingPg | default (randAlphaNum 32) -}}
{{- $redisPassword := .Values.redis.password | default $existingRedis | default (randAlphaNum 32) -}}
{{- $pgHost := ternary .Values.postgresql.host (printf "%s-postgresql" (include "comic.fullname" .)) .Values.postgresql.external -}}
{{- $redisHost := ternary .Values.redis.host (printf "%s-redis" (include "comic.fullname" .)) .Values.redis.external -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "comic.fullname" . }}
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "comic.labels" . | nindent 4 }}
type: Opaque
stringData:
  APP_SECRET_KEY: {{ $appSecret | quote }}
  JWT_SECRET_KEY: {{ $jwtSecret | quote }}
  POSTGRES_PASSWORD: {{ $pgPassword | quote }}
  REDIS_PASSWORD: {{ $redisPassword | quote }}
  DATABASE_URL: {{ printf "postgresql+asyncpg://%s:%s@%s:%d/%s" .Values.postgresql.username $pgPassword $pgHost (int .Values.postgresql.port) .Values.postgresql.database | quote }}
  REDIS_URL: {{ printf "redis://:%s@%s:%d/0" $redisPassword $redisHost (int .Values.redis.port) | quote }}
  RATE_LIMIT_REDIS_URL: {{ printf "redis://:%s@%s:%d/0" $redisPassword $redisHost (int .Values.redis.port) | quote }}
  CELERY_BROKER_URL: {{ printf "redis://:%s@%s:%d/1" $redisPassword $redisHost (int .Values.redis.port) | quote }}
  CELERY_RESULT_BACKEND: {{ printf "redis://:%s@%s:%d/2" $redisPassword $redisHost (int .Values.redis.port) | quote }}

  {{- if .Values.oss.enabled }}
  # 阿里云 OSS 访问密钥
  OSS_ACCESS_KEY_ID: {{ .Values.oss.accessKeyId | quote }}
  OSS_ACCESS_KEY_SECRET: {{ .Values.oss.accessKeySecret | quote }}
  {{- end }}
{{- end -}}
