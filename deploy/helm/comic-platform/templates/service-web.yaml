{{/*
Service - backend-web (ClusterIP)
集群内暴露 Web API 服务,供前端和其他服务调用
*/}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "comic.fullname" . }}-web
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "comic.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend-web
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "comic.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: backend-web
