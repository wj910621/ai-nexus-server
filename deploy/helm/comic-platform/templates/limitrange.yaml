{{/*
LimitRange - Phase 8 P7 安全加固
为未设置资源限制的容器提供默认值，并设置最大资源上限
- default: 默认资源限制 (未设置 limits 时使用)
- defaultRequest: 默认资源请求 (未设置 requests 时使用)
- max: 单容器资源上限
*/}}
apiVersion: v1
kind: LimitRange
metadata:
  name: {{ include "comic.fullname" . }}-limits
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "comic.labels" . | nindent 4 }}
spec:
  limits:
    - type: Container
      default:
        cpu: 500m
        memory: 512Mi
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      max:
        cpu: "4"
        memory: 8Gi
