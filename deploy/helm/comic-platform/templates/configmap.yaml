{{/*
ConfigMap - 应用非敏感配置
包含环境变量、数据库 URL、Redis URL 等非机密信息
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "comic.fullname" . }}
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "comic.labels" . | nindent 4 }}
data:
  # 应用环境标识
  APP_ENV: {{ .Values.env | quote }}
  APP_DEBUG: "false"
  RUN_MIGRATIONS_ON_STARTUP: "false"
  RATE_LIMIT_ENABLED: "true"
  BILLING_MODE: {{ .Values.app.billingMode | quote }}
  JARVIS_BILLING_PORTAL_URL: {{ .Values.app.jarvisBillingPortalUrl | quote }}
  JARVIS_GATEWAY_ENABLED: {{ .Values.app.jarvisGatewayEnabled | quote }}
  JARVIS_GATEWAY_BASE_URL: {{ .Values.app.jarvisGatewayBaseUrl | quote }}
  JARVIS_GATEWAY_DEFAULT_MODEL: {{ .Values.app.jarvisGatewayDefaultModel | quote }}
  YNEX_SSO_ISSUER: {{ .Values.app.ynexSsoIssuer | quote }}
  YNEX_SSO_AUDIENCE: {{ .Values.app.ynexSsoAudience | quote }}
  YNEX_BILLING_BASE_URL: {{ .Values.app.ynexBillingBaseUrl | quote }}

  # 上传目录
  UPLOAD_DIR: "/data/uploads"
  MODELS_DIR: "/data/models"

  {{- if .Values.oss.enabled }}
  # 对象存储 OSS 配置
  OSS_BUCKET: {{ .Values.oss.bucket | quote }}
  OSS_ENDPOINT: {{ .Values.oss.endpoint | quote }}
  OSS_ENABLED: "true"
  {{- else }}
  OSS_ENABLED: "false"
  {{- end }}
