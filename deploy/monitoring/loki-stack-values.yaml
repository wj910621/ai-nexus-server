# loki-stack Helm Chart 自定义 values
# Phase 8 P6 监控可观测性 - 日志聚合 (Loki + Promtail)
# 用法: helm upgrade --install loki-stack grafana/loki-stack \
#        --namespace monitoring -f loki-stack-values.yaml

# ---------------------------------------------------------------------------
# Loki 配置 - 日志存储与查询
# ---------------------------------------------------------------------------
loki:
  enabled: true
  # 持久化存储
  persistence:
    enabled: true
    size: 50Gi
    storageClassName: standard
  # 资源限制
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 2Gi
  # 配置
  config:
    limits_config:
      # 保留 30 天日志
      retention_period: 720h
      # 单个查询最大返回条数
      max_entries_limit_per_query: 5000
      # 拒绝旧数据 ingestion (超过 7 天的日志不接收)
      reject_old_samples: true
      reject_old_samples_max_age: 168h

# ---------------------------------------------------------------------------
# Promtail 配置 - 日志采集 agent
# ---------------------------------------------------------------------------
promtail:
  enabled: true
  # Loki 推送地址
  config:
    lokiAddress: http://loki:3100/loki/api/v1/push
    # 采集 K8s 容器日志
    snippets:
      common: |
        - action: replace
          source_labels:
            - __meta_kubernetes_pod_node_name
          target_label: node_name
        - action: replace
          source_labels:
            - __meta_kubernetes_namespace
          target_label: namespace
        - action: replace
          replacement: $1
          separator: /
          source_labels:
            - __meta_kubernetes_pod_name
            - __meta_kubernetes_container_name
          target_label: pod
        - action: replace
          source_labels:
            - __meta_kubernetes_pod_name
          target_label: pod_name
        - action: replace
          source_labels:
            - __meta_kubernetes_container_name
          target_label: container_name
        - action: replace
          replacement: /var/log/pods/*$1/*.log
          separator: /
          source_labels:
            - __meta_kubernetes_pod_name
            - __meta_kubernetes_uid
          target_label: __path__
  # 启用 ServiceMonitor 让 Prometheus 抓取 promtail 自身指标
  serviceMonitor:
    enabled: true
  # 资源限制
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

# ---------------------------------------------------------------------------
# Grafana 配置 - 复用 kube-prometheus-stack 的 Grafana，不单独部署
# ---------------------------------------------------------------------------
grafana:
  enabled: false
