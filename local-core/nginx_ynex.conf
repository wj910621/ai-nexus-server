# Y·NEX Nginx 配置
# 步骤：
# 1. 注册并解析所有保护域名到 120.79.17.184
# 2. 申请 SSL 证书（推荐 Let's Encrypt 多域名证书）
# 3. 把此文件放到 /etc/nginx/sites-enabled/ynex.conf
# 4. 测试并重启 nginx: nginx -t && systemctl reload nginx

# ============================================================
# 阶段一：ynexai.cn 正式上线（j3trisheng.com 继续可用）
# 所有保护域名统一 301 到 https://ynexai.cn
# ============================================================

# HTTP：所有新域名统一跳到 HTTPS 主站
server {
    listen 80;
    listen [::]:80;
    server_name ynexai.cn www.ynexai.cn ynexai.com www.ynexai.com y-nex.cn www.y-nex.cn y-nex.com www.y-nex.com y-nexai.cn www.y-nexai.cn y-nexai.com www.y-nexai.com;
    return 301 https://ynexai.cn$request_uri;
}

# HTTPS 主站
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ynexai.cn www.ynexai.cn;

    ssl_certificate /etc/letsencrypt/live/ynexai.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ynexai.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # ===== 安全头 =====
    # HSTS：强制 HTTPS，有效期 1 年，包含子域名
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # CSP：限制资源加载来源
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://api.deepseek.com https://api.openai.com wss: ws:; media-src 'self' blob:; object-src 'none'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
    # 防止 MIME 类型嗅探
    add_header X-Content-Type-Options "nosniff" always;
    # 防止点击劫持
    add_header X-Frame-Options "SAMEORIGIN" always;
    # 控制 Referrer 信息
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # 权限策略
    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(self)" always;

    # 上传大小限制（与后端 MAX_CONTENT_LENGTH_MB=64 对齐）
    client_max_body_size 64m;

    # Gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;

    root /home/admin/ai-nexus/;
    index landing.html;

    location = /manifest.json {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /landing.html;
    }

    location = /studio { return 301 /studio/; }
    location = /app { return 301 /app/; }

    location /app/ {
        alias /home/admin/ai-nexus/;
        index index.html dashboard.html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate, max-age=0" always;
        expires 0;
    }

    location /studio/ {
        alias /home/admin/ai-nexus/;
        index dashboard.html index.html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate, max-age=0" always;
        expires 0;
        return 301 /app/;
    }

    location = /download { return 301 /download/; }

    location /download/ {
        alias /home/admin/ai-nexus/download/;
        index index.html;
        try_files $uri $uri/ =404;
        autoindex off;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        sendfile on;
        tcp_nopush on;

        # 强制 .exe / .zip 文件弹出保存对话框，而不是直接打开
        location ~* \.(exe|zip)$ {
            add_header Content-Disposition "attachment" always;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket 升级支持
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }
}

# HTTPS 保护域名：统一 301 到主站
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ynexai.com www.ynexai.com y-nex.cn www.y-nex.cn y-nex.com www.y-nex.com y-nexai.cn www.y-nexai.cn y-nexai.com www.y-nexai.com;

    ssl_certificate /etc/letsencrypt/live/ynexai.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ynexai.cn/privkey.pem;

    return 301 https://ynexai.cn$request_uri;
}

