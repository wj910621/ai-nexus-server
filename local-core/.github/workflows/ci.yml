# Y·NEX CI — Lint + Test + Build Verification
# 触发条件：push 到 main/master/develop，或针对这些分支的 PR
name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

permissions:
  contents: read

jobs:
  python-lint:
    name: Python Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install ruff
        run: pip install ruff==0.5.0
      - name: Run ruff check
        run: ruff check .
      - name: Run ruff format check
        run: ruff format --check .

  python-test:
    name: Python Tests
    runs-on: ubuntu-latest
    needs: python-lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        run: python run_tests.py
        continue-on-error: true  # 测试可能需要环境变量，暂时不阻断

  js-lint:
    name: JS Lint (eslint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: TriGenClaw/package-lock.json
      - name: Install dependencies
        working-directory: TriGenClaw
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Run eslint
        working-directory: TriGenClaw
        run: npx eslint src/ --max-warnings 0
        continue-on-error: true  # 首次启用，暂不阻断

  secret-scan:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 完整历史用于扫描所有提交
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: true
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: true

  build-check:
    name: Build Verification
    runs-on: ubuntu-latest
    needs: [python-lint, js-lint]
    steps:
      - uses: actions/checkout@v4
      - name: Verify Python syntax
        run: |
          find . -name "*.py" -not -path "./TriGenClaw/*" -not -path "./.git/*" \
            -not -path "./server_files/*" -not -path "./node_modules/*" \
            | xargs -I{} python -m py_compile {}
      - name: Verify Node.js syntax
        working-directory: TriGenClaw
        run: |
          for f in $(find src -name "*.js"); do
            node --check "$f" || exit 1
          done
