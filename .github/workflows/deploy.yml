name: TriGen Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy Frontend & Backend
        if: ${{ secrets.SSH_PRIVATE_KEY != '' }}
        run: |
          which ssh-agent || apt-get update && apt-get install -y openssh-client
          eval $(ssh-agent -s)
          echo "${{ secrets.SSH_PRIVATE_KEY }}" | ssh-add -
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

          # 前端单文件 + PWA 配置
          scp -o StrictHostKeyChecking=no dashboard.html manifest.json sw.js admin@120.79.17.184:/home/admin/ai-nexus/
          scp -o StrictHostKeyChecking=no -r icons admin@120.79.17.184:/home/admin/ai-nexus/icons/

          # 后端
          scp -o StrictHostKeyChecking=no server.js wechat-pay.js package.json ecosystem.config.js admin@120.79.17.184:/home/admin/ai-nexus/
          scp -o StrictHostKeyChecking=no -r routes admin@120.79.17.184:/home/admin/ai-nexus/routes/

          # 重启
          ssh -o StrictHostKeyChecking=no admin@120.79.17.184 "cd /home/admin/ai-nexus && npm install --production && pm2 restart nexus-hub"

      - name: Skip Deploy (secrets not configured)
        if: ${{ secrets.SSH_PRIVATE_KEY == '' }}
        run: echo "SSH secrets not configured - skipping auto-deploy"
